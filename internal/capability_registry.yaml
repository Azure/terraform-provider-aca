# Capability Registry — Terraform ACA Extension Layer
#
# This registry maps ACA features to their implementing Terraform provider.
# It is the source of truth for provider routing decisions.
#
# Fields:
#   feature            - Unique feature identifier (matches feature_flags key)
#   description        - Human-readable description
#   resource_type      - ARM resource type
#   provider           - Current implementation provider (azurerm | azapi)
#   api_version        - Azure API version (relevant when provider = azapi)
#   native_in_azurerm  - Whether AzureRM natively supports this feature
#   preview            - Whether this is a preview feature
#   feature_flag       - The feature_flags key that gates this (null if GA/azurerm)
#   module             - Which submodule owns this feature
#
# When AzureRM adds native support for an azapi feature:
#   1. Set native_in_azurerm: true
#   2. Change provider: azurerm
#   3. Remove api_version (or leave for reference)
#   4. Update the corresponding module code
#   5. Document state migration steps

