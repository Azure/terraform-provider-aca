name: ACA Sandbox Provider Release

on:
  pull_request:
    paths:
      - '.github/workflows/provider-release.yml'
      - 'provider/**'
      - 'scripts/install-provider.sh'
      - 'scripts/install-provider.ps1'
  push:
    tags:
      - 'provider-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Resolve provider version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/provider-v* ]]; then
            version="${GITHUB_REF_NAME#provider-v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag must match provider-v<semver>; received $GITHUB_REF_NAME"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            version="0.0.0-dev"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Test provider
        working-directory: provider
        run: |
          go test ./...
          go vet ./...

      - name: Build release archives
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          targets=(
            windows/amd64
            windows/arm64
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
          )

          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            extension=""
            if [[ "$goos" == "windows" ]]; then
              extension=".exe"
            fi

            binary="terraform-provider-aca_v${VERSION}${extension}"
            archive="terraform-provider-aca_${VERSION}_${goos}_${goarch}.zip"

            (
              cd provider
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build \
                  -trimpath \
                  -ldflags "-s -w -X main.version=${VERSION}" \
                  -o "../dist/${binary}" \
                  .
            )

            (
              cd dist
              zip -q "$archive" "$binary"
              rm "$binary"
            )
          done

          (
            cd dist
            sha256sum *.zip > "terraform-provider-aca_${VERSION}_SHA256SUMS"
          )

      - name: Test provider installers
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server 8765 --directory dist >"$RUNNER_TEMP/provider-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          checksums="terraform-provider-aca_${VERSION}_SHA256SUMS"
          for _ in {1..20}; do
            if curl -fsS "http://127.0.0.1:8765/$checksums" >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -fsS "http://127.0.0.1:8765/$checksums" >/dev/null

          export ACA_TF_PROVIDER_VERSION="$VERSION"
          export ACA_TF_PLATFORM="linux_amd64"
          export ACA_TF_PROVIDER_RELEASE_URL="http://127.0.0.1:8765"

          ACA_TF_MIRROR_ROOT="$RUNNER_TEMP/bash-mirror" \
            ACA_TF_CONFIG_PATH="$RUNNER_TEMP/bash.terraform.rc" \
            bash scripts/install-provider.sh
          test -x "$RUNNER_TEMP/bash-mirror/registry.terraform.io/azure/aca/$VERSION/linux_amd64/terraform-provider-aca_v$VERSION"
          grep -F 'registry.terraform.io/azure/aca' "$RUNNER_TEMP/bash.terraform.rc"

          ACA_TF_MIRROR_ROOT="$RUNNER_TEMP/pwsh-mirror" \
            ACA_TF_CONFIG_PATH="$RUNNER_TEMP/pwsh.terraform.rc" \
            pwsh -File scripts/install-provider.ps1
          test -x "$RUNNER_TEMP/pwsh-mirror/registry.terraform.io/azure/aca/$VERSION/linux_amd64/terraform-provider-aca_v$VERSION"
          grep -F 'registry.terraform.io/azure/aca' "$RUNNER_TEMP/pwsh.terraform.rc"

      - name: Publish GitHub prerelease
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/provider-release-notes.md" <<EOF
          Preview build of the ACA Sandbox data-plane Terraform provider.

          Provider source address: \`registry.terraform.io/Azure/aca\`
          Provider version: \`${VERSION}\`
          Source commit: \`${GITHUB_SHA}\`

          This provider is not published to the Terraform Registry. Install the
          archive for your platform through a Terraform filesystem mirror.
          EOF

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/* \
              --verify-tag \
              --prerelease \
              --title "ACA Sandbox Terraform Provider v${VERSION}" \
              --notes-file "$RUNNER_TEMP/provider-release-notes.md"
          fi
